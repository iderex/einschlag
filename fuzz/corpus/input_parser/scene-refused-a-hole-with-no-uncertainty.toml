# A two-hole scene, both holes in one wall, from one projectile.
#
# Derived from the worked example in docs/decisions/0007-input-format.md. Three
# things are here that the example does not show, and each one is required by
# docs/decisions/0006-frame-and-units.md rather than invented for this file: the
# origin and the reference direction the frame is declared against, the ground,
# and each surface's material, contour and outline.
#
# The example's own A2 bearing is not copied. It states a value beside
# unknown = true, which that record refuses by name, and the file next to this
# one under refused/ is where that refusal has something to point at.
#
# Every other file under refused/ is this file with one line changed. A test
# asserts that, so "one field away from a valid file" is measured rather than
# claimed.

format_version = 1

[scene]
name = "synthetic example, not a real case"
origin = "the inside corner where the north and west walls meet, at floor level"
reference_direction = "+Y is grid north, taken along the north wall of the building"
# Extent is stated explicitly and is not inferred from the surfaces below.
extent = { x = [0.0, 12.0], y = [0.0, 8.0], z = [0.0, 3.0], unit = "m" }
ground = { value = 0.0, unit = "m", sd = 0.01 }

[[scene.surface]]
id = "wall-north"
material = "gypsum-wallboard-12mm"
contour = "flat"
outline = { unit = "m", vertices = [[0.0, 0.0, 0.0], [8.0, 0.0, 0.0], [8.0, 0.0, 3.0], [0.0, 0.0, 3.0]] }
# Assumed vertical from the building, not measured. Recorded as an interval
# rather than a standard deviation because nothing was measured to have one.
normal_azimuth = { value = 180.0, unit = "deg", interval = [178.0, 182.0] }
normal_elevation = { value = 0.0, unit = "deg", interval = [-2.0, 2.0] }

[[hole]]
id = "A1"
surface = "wall-north"
material = "gypsum-wallboard-12mm"
trajectory = "T1"
centre = { value = [4.210, 0.0, 1.480], unit = "m", sd = [0.005, 0.005, 0.005] }
major_axis = { value = 14.8, unit = "mm" }
minor_axis = { value = 9.1, unit = "mm", sd = 0.6 }
# Nearly circular holes make this meaningless; this one is not.
major_axis_bearing = { value = 63.0, unit = "deg", sd = 4.0 }
deformation = "moderate"

[[hole]]
id = "A2"
surface = "wall-north"
material = "gypsum-wallboard-12mm"
trajectory = "T1"
centre = { value = [4.905, 0.10, 1.395], unit = "m", sd = [0.005, 0.005, 0.005] }
major_axis = { value = 15.2, unit = "mm", sd = 0.6 }
minor_axis = { value = 9.4, unit = "mm", sd = 0.6 }
# Torn enough that where the major axis lies is a judgement, so nothing was
# established about it. That is a statement and it has to be typed.
major_axis_bearing = { unknown = true }
deformation = "severe"
