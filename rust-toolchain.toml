# The one tracked file that carries the toolchain version.
#
# A clone that has rustup installed picks this compiler up without anybody being
# told to, which is the failure a documented minimum version does not prevent.
# Nothing else in the tree restates the number: docs/BUILD.md points here and
# gives the command that prints it.
#
# The channel is an exact version rather than "stable". "stable" moves under the
# same source, and docs/decisions/0009-determinism.md promises that the same
# input, the same seed and the same build produce byte-identical output.

[toolchain]
channel = "1.97.0"
profile = "minimal"

# The formatter and the linter, named here so that a clone gets them from this
# file rather than from an instruction somebody has to follow. Both are pinned to
# the same release as the compiler by being components of it, which is what stops
# two machines disagreeing about what is formatted or what is a warning.
#
# They are the reason the profile above is not the whole story: "minimal" is the
# compiler, Cargo and the standard library, and neither of these is in it.
# llvm-tools is here for a different reason from the other two: nothing in the
# default routes uses it, and the coverage command in docs/TESTING.md does. It is
# a component rather than a separate download so that the instrumentation and the
# compiler that produced the profile are the same release.
components = ["rustfmt", "clippy", "llvm-tools"]
