[package]
name = "einschlag"
description = "Geometry and uncertainty core for shooting-scene reconstruction"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The exact version rather than a range. A different release of this crate may
# return a different last place, which is the thing
# docs/decisions/0013-platform-math-out-of-the-numeric-core.md pins. Cargo.lock is
# tracked and holds the version for anybody building this repository; it is
# ignored for anybody depending on this crate as a library, and the record's
# promise is about the arithmetic rather than about who is building.
# docs/DEPENDENCIES.md carries the whole argument.
libm = "=0.2.16"

# Every warning is refused rather than printed, and the levels are in the
# workspace manifest so that all three crates carry the same ones.
[lints]
workspace = true
