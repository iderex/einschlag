[package]
name = "einschlag-cli"
description = "Command line front end for the einschlag core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "einschlag"
path = "src/main.rs"

[dependencies]
einschlag = { path = "../einschlag" }

# Every warning is refused rather than printed, and the levels are in the
# workspace manifest so that all three crates carry the same ones.
[lints]
workspace = true
