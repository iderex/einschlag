# The first workflow in this repository that compiles the code.
#
# The five guards beside it read the tree, the history and each other; none of
# them builds or tests anything, so until this file landed nothing outside a
# developer's own machine had ever built this workspace.
#
# **The four names build, test, fmt and lint are matched literally elsewhere.**
# They are what a branch protection rule names when it requires a check, and a
# rename here that nobody notices removes a requirement without removing anything
# visible. docs/BUILD.md carries the same four names and says the same thing.
# Entry 3 of issue #1 is where requiring them is decided; today the ruleset on
# this repository requires no status check at all, which CONTRIBUTING.md quotes
# with the command that produced it.
#
# coverage is a fifth job and is deliberately not one of those four. It measures
# and prints a number and enforces no threshold, so there is nothing there for a
# rule to require. Issue #55 is where a threshold is set against this baseline.
#
# **Every command below is one docs/BUILD.md or docs/TESTING.md gives a person to
# type.** Not a variant of it, not a superset. Two procedures that drift apart is
# how a green build stops meaning anything: the job passes, the person's run
# fails, and neither of them is wrong about what it ran.
name: ci

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Read-only, and no job below asks for more. Nothing here writes to the
# repository, uploads an artefact, or publishes anything.
permissions:
  contents: read

# Cancel a superseded run on the same ref. Every job here is a read-only build of
# a commit, so a cancelled run leaves nothing behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A panic inside a test prints where it came from. Without this a failing
  # assertion in the suite arrives as a line number and nothing else, and the
  # rerun that would have shown the rest costs another full build.
  RUST_BACKTRACE: "1"

# --locked on every job that resolves dependencies, which is all of them except
# fmt. It refuses to build where Cargo.lock would have to change, so a
# dependency added without the lock being committed reddens the build instead
# of resolving quietly into a graph nobody reviewed. A reconstruction has to be
# reproducible from the same input years later, and a build that resolved
# something else is a different program.
jobs:
  # No job installs a toolchain, and that is deliberate. rust-toolchain.toml is
  # the one tracked file that carries the version, and the rustup already on the
  # runner reads it and fetches the pinned compiler with the components named
  # beside it. An action that took a version as an input would be a second place
  # to set it, which crates/einschlag/tests/toolchain_pin.rs refuses by name.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build.rs derives the commit from git, so the checkout has to be a git
          # repository. No step pushes, so the token is not persisted.
          persist-credentials: false
      - name: cargo build --release --locked
        run: cargo build --release --locked

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The suite is required to run with no display available and with no
      # elevated rights, and until this step existed nothing anywhere asserted
      # either. The two checks in the suite read the source for the names a
      # display or an elevation request is made through, which is a floor: a run
      # under an administrator token on a machine with a session passes both.
      #
      # This asserts the conditions of the run instead, and it can only do that
      # here. Rust has no declaration of what a test requires, and reading the
      # process's own privilege level from a test needs a foreign function call
      # into the platform, on a project that carries no unsafe code anywhere. The
      # shell of an unattended job is where the question is cheap and where the
      # answer is not a property of somebody's workstation.
      #
      # It deliberately does not run on a developer's machine. Somebody with a
      # good reason to be an administrator, or working at a desk with a display,
      # is not doing anything wrong; what would be wrong is the suite that is
      # reported green having been a different suite. Issue #88 argues that at
      # length and docs/TESTING.md carries the residual.
      - name: Refuse a run that is privileged or has a display
        run: |
          set -euo pipefail
          failed=0
          # Fail closed on an id that cannot be read at all, rather than reading
          # an unanswered question as a pass.
          if ! uid=$(id -u); then
            echo "::error::could not read the effective user id, so nothing here can say the run was unprivileged."
            exit 1
          fi
          if [ "$uid" -eq 0 ]; then
            echo "::error::this run is root (uid $uid). The suite is required to run unprivileged, and a test that passes here would not be the test a restricted machine runs."
            failed=1
          else
            echo "effective user id $uid, which is not root."
          fi
          # Named individually rather than by prefix, so the list says what it
          # covers and a reader can see what it does not. Expanded into the list
          # rather than read back by indirection, which keeps this to constructs
          # every shell has.
          for pair in "DISPLAY=${DISPLAY:-}" "WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}" "XDG_SESSION_TYPE=${XDG_SESSION_TYPE:-}"; do
            name=${pair%%=*}
            value=${pair#*=}
            if [ -n "$value" ]; then
              echo "::error::$name is set to '$value'. The suite is required to run with no display available."
              failed=1
            fi
          done
          if [ "$failed" -eq 0 ]; then
            echo "no display variable is set."
          fi
          exit "$failed"
      # Temporary, beside the capability it measures. The whole suite stops at
      # the first failing binary, so the artefact check would never run on this
      # platform without a step that names it.
      - name: Temporary, the artefact check on its own
        continue-on-error: true
        run: cargo test --locked -p einschlag-cli --test nothing_goes_out_of_the_artefact
      - name: cargo test --locked
        run: cargo test --locked

  # Not one of the four names above. It prints a number and enforces nothing:
  # #28 asks for the measurement and says in as many words that a threshold set
  # before there is code to measure is a number picked from the air. #55 is where
  # one is set against this baseline.
  #
  # This is its own job rather than a step in `test`, because installing the
  # subcommand costs minutes and `test` is the signal somebody watches. What it
  # costs to keep them apart is a second compile of the workspace, under
  # instrumentation, which is not the same compile anyway.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # From crates.io at an exact version, with --locked, rather than from an
      # action that fetches a release binary. It is slower and it is the same
      # trust root as every other package this workspace resolves, which is one
      # fewer supply-chain surface to argue about for a job that gates nothing.
      # rust-toolchain.toml names llvm-tools, so the instrumentation this needs
      # arrives with the pinned compiler rather than from a separate install.
      - name: cargo install --locked cargo-llvm-cov@0.8.7
        run: cargo install --locked cargo-llvm-cov@0.8.7
      - name: cargo llvm-cov --workspace --locked --summary-only
        run: cargo llvm-cov --workspace --locked --summary-only

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # There is no -D warnings on this line and there is not meant to be one.
      # The lint levels are in the [workspace.lints] table of the root manifest,
      # so this command carries the same rules a person's does. A flag here would
      # hold where the flag was typed and nowhere else.
      - name: cargo clippy --workspace --all-targets --locked
        run: cargo clippy --workspace --all-targets --locked
